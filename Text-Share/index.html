<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Share</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 25px; background: #f1f3f5; font-family: sans-serif; color: #222; }
.container { max-width: 750px; margin: 40px auto; padding: 25px; background: white; border-radius: 14px; box-shadow: 0 3px 15px #0001; }
h1 { margin-top: 0; font-size: 25px; }
h2 { font-size: 19px; margin: 0 0 14px; }
textarea { width: 100%; height: 350px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; resize: vertical; font-size: 16px; line-height: 1.6; font-family: sans-serif; }
#status, #fileStatus { margin-top: 12px; color: #666; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
input { width: 100%; padding: 12px; margin: 7px 0; border: 1px solid #ccc; border-radius: 7px; font-size: 16px; }
button { padding: 10px 16px; border: none; border-radius: 7px; background: #2563eb; color: white; font-size: 14px; cursor: pointer; }
button:hover { background: #1d4ed8; }
button:disabled { opacity: .55; cursor: wait; }
#logout { background: #666; }
.hidden { display: none !important; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
.panel { margin-top: 25px; padding-top: 22px; border-top: 1px solid #e5e7eb; }
.file-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.file-controls input[type=file] { flex: 1; min-width: 190px; margin: 0; padding: 8px; }
.drop-zone { margin-top: 12px; padding: 30px 16px; border: 2px dashed #9ca3af; border-radius: 10px; background: #f9fafb; color: #555; text-align: center; transition: background .15s, border-color .15s, color .15s; }
.drop-zone strong { display: block; margin-bottom: 6px; color: #333; }
.drop-zone.drag-over { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
.drop-zone.drag-over strong { color: #1d4ed8; }
.file-list { list-style: none; padding: 0; margin: 14px 0 0; }
.file-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
.file-name { min-width: 0; overflow-wrap: anywhere; }
.file-meta { color: #777; font-size: 12px; margin-top: 4px; }
.file-actions { display: flex; gap: 7px; flex-shrink: 0; }
.delete-btn { background: #dc2626; }
@media (max-width: 520px) { body { padding: 12px; } .container { margin: 15px auto; padding: 18px; } .file-item { align-items: flex-start; flex-direction: column; } }
</style>
</head>
<body>
<div class="container">
  <h1>Text Share</h1>
  <div id="loginArea">
    <h3>ログイン</h3>
    <input id="email" type="email" placeholder="メールアドレス" autocomplete="username">
    <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
    <button id="login">ログイン</button>
    <p id="loginStatus"></p>
  </div>
  <div id="editorArea" class="hidden">
    <div class="header"><span>共有テキスト</span><button id="logout">ログアウト</button></div>
    <textarea id="text" placeholder="ここに文章を入力..."></textarea>
    <div id="status">接続中...</div>
    <section class="panel">
      <h2>ファイル共有</h2>
      <div class="file-controls">
        <input id="fileInput" type="file" multiple>
        <button id="uploadButton">選択したファイルをアップロード</button>
        <button id="refreshButton" type="button">更新</button>
      </div>
      <div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="ファイルをここにドラッグ＆ドロップ">
        <strong>ここにファイルをドラッグ＆ドロップ</strong>
        <span>複数ファイルもまとめて追加できます</span>
      </div>
      <div id="fileStatus">ファイル一覧を読み込みます...</div>
      <ul id="fileList" class="file-list"></ul>
      <p class="file-meta">1ファイル最大50MB。50MBを超えるファイルは可能な形式のみ自動圧縮します。共有スペース内のファイルは、ログインできるユーザー全員が閲覧・削除できます。</p>
    </section>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const firebaseConfig = {
  apiKey: "AIzaSyDsVCvRiIuy0ji_jSA1s-hHO63b5eONsYc",
  authDomain: "text-share-a7de6.firebaseapp.com",
  databaseURL: "https://text-share-a7de6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "text-share-a7de6",
  appId: "1:756434973756:web:35387a44f9cfd842cc7f39"
};
const supabaseUrl = "https://mhjqgljerfbbnsxcnatw.supabase.co";
const supabasePublishableKey = "sb_publishable_4uMzzz4ixzKWWufH6AlDLQ_9ASiYvPU";
const bucketName = "shared-files";
const maxFileSize = 50 * 1024 * 1024;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const textRef = ref(db, "sharedText");
const supabase = createClient(supabaseUrl, supabasePublishableKey, {
  accessToken: async () => (await auth.currentUser?.getIdToken()) ?? null
});

const $ = (id) => document.getElementById(id);
const loginArea = $("loginArea"), editorArea = $("editorArea");
const emailInput = $("email"), passwordInput = $("password");
const textarea = $("text"), status = $("status"), loginStatus = $("loginStatus");
const fileInput = $("fileInput"), fileStatus = $("fileStatus"), fileList = $("fileList");
const uploadButton = $("uploadButton"), refreshButton = $("refreshButton"), dropZone = $("dropZone");
let saveTimer = null, unsubscribe = null, dragDepth = 0;

$("login").addEventListener("click", async () => {
  loginStatus.textContent = "ログイン中...";
  try { await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value); loginStatus.textContent = ""; }
  catch (error) { loginStatus.textContent = "ログイン失敗: " + error.message; }
});
$("logout").addEventListener("click", async () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  clearTimeout(saveTimer); saveTimer = null;
  if (user) {
    loginArea.classList.add("hidden"); editorArea.classList.remove("hidden");
    status.textContent = "データを読み込み中...";
    unsubscribe = onValue(textRef, (snapshot) => {
      if (saveTimer !== null) return;
      const newText = snapshot.val() ?? "";
      if (textarea.value !== newText) textarea.value = newText;
      status.textContent = "同期中・最新データを表示しています";
    }, (error) => { status.textContent = "読み込みエラー: " + error.message; });
    refreshFiles();
  } else {
    loginArea.classList.remove("hidden"); editorArea.classList.add("hidden");
    textarea.value = ""; fileList.replaceChildren(); fileStatus.textContent = "";
  }
});

textarea.addEventListener("input", () => {
  status.textContent = "保存待ち..."; clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const content = textarea.value; status.textContent = "保存中...";
    try { await set(textRef, content); status.textContent = "保存完了"; }
    catch (error) { status.textContent = "保存エラー: " + error.message; }
    finally { saveTimer = null; }
  }, 400);
});

function formatBytes(bytes) {
  if (!Number.isFinite(bytes)) return "";
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}
function showFileError(prefix, error) {
  console.error(prefix, error); fileStatus.textContent = `${prefix}: ${error?.message ?? error}`;
}
async function refreshFiles() {
  if (!auth.currentUser) return;
  fileStatus.textContent = "ファイル一覧を読み込み中..."; fileList.replaceChildren();
  const { data, error } = await supabase.storage.from(bucketName).list("", { limit: 100, sortBy: { column: "created_at", order: "desc" } });
  if (error) { showFileError("一覧取得エラー", error); return; }
  const files = (data ?? []).filter(item => item.name && item.id);
  if (!files.length) { fileStatus.textContent = "共有ファイルはまだありません。"; return; }
  fileStatus.textContent = `${files.length} 件のファイル`;
  for (const file of files) {
    const li = document.createElement("li"); li.className = "file-item";
    const info = document.createElement("div"); info.className = "file-name";
    const name = document.createElement("div"); name.textContent = file.name;
    const meta = document.createElement("div"); meta.className = "file-meta";
    meta.textContent = formatBytes(file.metadata?.size) || "サイズ情報なし";
    info.append(name, meta);
    const actions = document.createElement("div"); actions.className = "file-actions";
    const dl = document.createElement("button"); dl.textContent = "ダウンロード";
    dl.addEventListener("click", () => downloadFile(file.name));
    const del = document.createElement("button"); del.textContent = "削除"; del.className = "delete-btn";
    del.addEventListener("click", () => deleteFile(file.name));
    actions.append(dl, del); li.append(info, actions); fileList.append(li);
  }
}

// 画像：CanvasでWebP化。品質を段階的に下げ、50MB以下を目指す。
async function compressImage(file) {
  if (!("createImageBitmap" in window)) throw new Error("このブラウザは画像圧縮に対応していません");
  const bitmap = await createImageBitmap(file);
  try {
    let width = bitmap.width, height = bitmap.height;
    const maxDimension = 3840;
    if (Math.max(width, height) > maxDimension) {
      const scale = maxDimension / Math.max(width, height);
      width = Math.round(width * scale); height = Math.round(height * scale);
    }
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const qualities = [0.88, 0.78, 0.68, 0.58, 0.48, 0.38];
    let blob = null;
    for (let attempt = 0; attempt < 7; attempt++) {
      canvas.width = width; canvas.height = height;
      ctx.drawImage(bitmap, 0, 0, width, height);
      const quality = qualities[Math.min(attempt, qualities.length - 1)];
      blob = await new Promise(resolve => canvas.toBlob(resolve, "image/webp", quality));
      if (blob && blob.size <= maxFileSize) break;
      if (attempt >= 5) { width = Math.round(width * 0.8); height = Math.round(height * 0.8); }
    }
    if (!blob) throw new Error("画像を変換できませんでした");
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".webp", { type: "image/webp", lastModified: Date.now() });
  } finally { bitmap.close?.(); }
}

// テキスト：CompressionStreamでGZIP化。拡張子 .gz を付けて元データを保持する。
async function gzipText(file) {
  if (!("CompressionStream" in window)) throw new Error("このブラウザはGZIP圧縮に対応していません");
  const stream = new Blob([file]).stream().pipeThrough(new CompressionStream("gzip"));
  const blob = await new Response(stream).blob();
  return new File([blob], file.name + ".gz", { type: "application/gzip", lastModified: Date.now() });
}

// 動画・音声：MediaRecorderでWebM/Opus等に再エンコード。ブラウザ対応形式のみ。
async function transcodeMedia(file) {
  if (!("MediaRecorder" in window)) throw new Error("このブラウザはメディア再圧縮に対応していません");
  const sourceUrl = URL.createObjectURL(file);
  let mediaElement = null, audioContext = null, stream = null, recorder = null;
  try {
    const isVideo = file.type.startsWith("video/");
    if (isVideo) {
      mediaElement = document.createElement("video");
      mediaElement.muted = false; mediaElement.playsInline = true; mediaElement.preload = "auto";
      mediaElement.src = sourceUrl;
      await new Promise((resolve, reject) => {
        mediaElement.onloadedmetadata = resolve;
        mediaElement.onerror = () => reject(new Error("動画を読み込めませんでした"));
      });
      if (mediaElement.duration > 60 * 60) throw new Error("1時間を超える動画はブラウザ内圧縮の対象外です");
      const canvas = document.createElement("canvas");
      const scale = Math.min(1, 1280 / mediaElement.videoWidth, 720 / mediaElement.videoHeight);
      canvas.width = Math.max(2, Math.round(mediaElement.videoWidth * scale / 2) * 2);
      canvas.height = Math.max(2, Math.round(mediaElement.videoHeight * scale / 2) * 2);
      const ctx = canvas.getContext("2d");
      const videoStream = canvas.captureStream(24);
      let tracks = [...videoStream.getVideoTracks()];
      // 音声トラックも可能なら収録する
      if (mediaElement.captureStream) {
        const originalStream = mediaElement.captureStream();
        tracks = tracks.concat(originalStream.getAudioTracks());
      }
      stream = new MediaStream(tracks);
      const mimeType = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
        .find(type => MediaRecorder.isTypeSupported(type));
      if (!mimeType) throw new Error("対応するWebM動画エンコーダーがありません");
      const chunks = [];
      recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 1400000, audioBitsPerSecond: 96000 });
      const finished = new Promise((resolve, reject) => {
        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        recorder.onerror = () => reject(new Error("動画の再圧縮に失敗しました"));
        recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType }));
      });
      let drawId;
      const draw = () => {
        if (mediaElement.paused || mediaElement.ended) return;
        ctx.drawImage(mediaElement, 0, 0, canvas.width, canvas.height);
        drawId = requestAnimationFrame(draw);
      };
      recorder.start(1000);
      await mediaElement.play();
      draw();
      await new Promise(resolve => { mediaElement.onended = resolve; });
      cancelAnimationFrame(drawId);
      if (recorder.state !== "inactive") recorder.stop();
      const result = await finished;
      return new File([result], file.name.replace(/\.[^.]+$/, "") + ".webm", { type: mimeType, lastModified: Date.now() });
    }

    // 音声のみ
    audioContext = new AudioContext();
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
    if (audioBuffer.duration > 60 * 60) throw new Error("1時間を超える音声はブラウザ内圧縮の対象外です");
    const source = audioContext.createBufferSource();
    source.buffer = audioBuffer;
    const destination = audioContext.createMediaStreamDestination();
    source.connect(destination);
    stream = destination.stream;
    const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"]
      .find(type => MediaRecorder.isTypeSupported(type));
    if (!mimeType) throw new Error("対応する音声エンコーダーがありません");
    const chunks = [];
    recorder = new MediaRecorder(stream, { mimeType, audioBitsPerSecond: 96000 });
    const finished = new Promise((resolve, reject) => {
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onerror = () => reject(new Error("音声の再圧縮に失敗しました"));
      recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType }));
    });
    recorder.start(1000);
    source.start();
    await new Promise(resolve => { source.onended = resolve; });
    if (recorder.state !== "inactive") recorder.stop();
    const result = await finished;
    const ext = mimeType.includes("ogg") ? ".ogg" : ".webm";
    return new File([result], file.name.replace(/\.[^.]+$/, "") + ext, { type: mimeType, lastModified: Date.now() });
  } finally {
    if (recorder && recorder.state !== "inactive") recorder.stop();
    stream?.getTracks().forEach(track => track.stop());
    if (mediaElement) { mediaElement.pause(); mediaElement.removeAttribute("src"); mediaElement.load(); }
    if (audioContext && audioContext.state !== "closed") await audioContext.close();
    URL.revokeObjectURL(sourceUrl);
  }
}

function isAlreadyCompressed(file) {
  return /\.(zip|7z|rar|gz|bz2|xz|zst|jpg|jpeg|png|webp|avif|heic|mp3|aac|m4a|ogg|opus|mp4|m4v|mov|webm|mkv|avi)$/i.test(file.name);
}
async function prepareFile(originalFile) {
  if (originalFile.size <= maxFileSize) return originalFile;
  const type = originalFile.type || "";
  fileStatus.textContent = `50MB超過。圧縮方法を判定中: ${originalFile.name}`;

  if (type.startsWith("image/") || /\.(png|jpe?g|webp|bmp|gif|avif)$/i.test(originalFile.name)) {
    return await compressImage(originalFile);
  }
  if (type.startsWith("video/")) return await transcodeMedia(originalFile);
  if (type.startsWith("audio/")) return await transcodeMedia(originalFile);
  if (type.startsWith("text/") || /\.(txt|csv|json|xml|html|css|js|md|log|svg)$/i.test(originalFile.name)) {
    return await gzipText(originalFile);
  }
  if (type === "application/pdf" || /\.pdf$/i.test(originalFile.name)) {
    throw new Error("PDFは内容を壊さずに圧縮する標準機能がないため、自動圧縮できません");
  }
  if (isAlreadyCompressed(originalFile)) {
    throw new Error("すでに圧縮済みの形式です。再圧縮しても小さくならない可能性が高いため、50MB以下にする必要があります");
  }
  throw new Error("この形式の自動圧縮には対応していません");
}

async function uploadFiles(fileCollection) {
  const files = Array.from(fileCollection ?? []);
  if (!files.length) { fileStatus.textContent = "ファイルを選択するか、ここにドロップしてね。"; return; }
  if (!auth.currentUser) { fileStatus.textContent = "ログインしてください。"; return; }
  uploadButton.disabled = true; fileInput.disabled = true;
  let uploaded = 0;
  const errors = [];
  try {
    for (let i = 0; i < files.length; i++) {
      const original = files[i];
      let file = original;
      try {
        if (original.size > maxFileSize) {
          fileStatus.textContent = `圧縮中... (${i + 1}/${files.length}) ${original.name} (${formatBytes(original.size)})`;
          file = await prepareFile(original);
          if (file.size >= original.size) {
            if (original.size <= maxFileSize) file = original;
            else throw new Error(`圧縮しても容量が減りませんでした (${formatBytes(file.size)})`);
          }
        }
        if (file.size > maxFileSize) throw new Error(`圧縮後も50MBを超えています (${formatBytes(file.size)})`);
        fileStatus.textContent = `アップロード中... (${i + 1}/${files.length}) ${file.name} (${formatBytes(file.size)})`;
        const safeName = file.name.normalize("NFKD").replace(/[^a-zA-Z0-9._-]/g, "_").replace(/_+/g, "_").replace(/^[._-]+|[._-]+$/g, "") || "file";
        const objectPath = `${Date.now()}_${crypto.randomUUID()}_${safeName}`;
        const { error } = await supabase.storage.from(bucketName).upload(objectPath, file, { cacheControl: "3600", upsert: false });
        if (error) throw error;
        uploaded++;
      } catch (error) {
        console.error("ファイル処理エラー", original.name, error);
        errors.push(`${original.name}: ${error?.message ?? error}`);
      }
    }
  } finally {
    uploadButton.disabled = false; fileInput.disabled = false; fileInput.value = "";
  }
  if (uploaded > 0) await refreshFiles();
  if (errors.length) fileStatus.textContent = `${uploaded}件アップロード成功 / ${errors.length}件失敗\n${errors.join("\n")}`;
  else fileStatus.textContent = `${uploaded}件のアップロード完了！`;
}

async function downloadFile(path) {
  fileStatus.textContent = "ダウンロード準備中...";
  const { data, error } = await supabase.storage.from(bucketName).download(path);
  if (error) { showFileError("ダウンロードエラー", error); return; }
  const url = URL.createObjectURL(data), a = document.createElement("a");
  a.href = url; a.download = path.replace(/^\d+_[0-9a-f-]+_/, "");
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  fileStatus.textContent = "ダウンロードを開始しました。";
}
async function deleteFile(path) {
  if (!confirm(`「${path}」を削除する？`)) return;
  fileStatus.textContent = "削除中...";
  const { error } = await supabase.storage.from(bucketName).remove([path]);
  if (error) { showFileError("削除エラー", error); return; }
  fileStatus.textContent = "削除しました。"; await refreshFiles();
}
uploadButton.addEventListener("click", () => uploadFiles(fileInput.files));
refreshButton.addEventListener("click", refreshFiles);

function isFileDrag(event) { return Array.from(event.dataTransfer?.types ?? []).includes("Files"); }
dropZone.addEventListener("dragenter", event => {
  if (!isFileDrag(event)) return; event.preventDefault(); dragDepth++; dropZone.classList.add("drag-over");
});
dropZone.addEventListener("dragover", event => {
  if (!isFileDrag(event)) return; event.preventDefault(); event.dataTransfer.dropEffect = "copy";
});
dropZone.addEventListener("dragleave", event => {
  if (!isFileDrag(event)) return; event.preventDefault(); dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) dropZone.classList.remove("drag-over");
});
dropZone.addEventListener("drop", event => {
  event.preventDefault(); dragDepth = 0; dropZone.classList.remove("drag-over");
  if (event.dataTransfer?.files?.length) uploadFiles(event.dataTransfer.files);
});
document.addEventListener("dragover", event => { if (isFileDrag(event)) event.preventDefault(); });
document.addEventListener("drop", event => {
  if (isFileDrag(event) && !dropZone.contains(event.target)) event.preventDefault();
});
</script>
</body>
</html>
