
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Share</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    background: #f1f3f5;
    font-family: sans-serif;
}

.container {
    max-width: 750px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 3px 15px #0001;
}

h1 {
    margin-top: 0;
    font-size: 25px;
}

textarea {
    width: 100%;
    height: 350px;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    font-size: 16px;
    line-height: 1.6;
    font-family: sans-serif;
}

#status {
    margin-top: 12px;
    color: #666;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    padding: 11px 20px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#logout {
    background: #666;
}

.hidden {
    display: none;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Text Share</h1>

    <!-- ログイン画面 -->
    <div id="loginArea">
        <h3>ログイン</h3>

        <input id="email"
            type="email"
            placeholder="メールアドレス">

        <input id="password"
            type="password"
            placeholder="パスワード">

        <button id="login">ログイン</button>

        <p id="loginStatus"></p>
    </div>

    <!-- 文章共有画面 -->
    <div id="editorArea" class="hidden">

        <div class="header">
            <span>共有テキスト</span>
            <button id="logout">ログアウト</button>
        </div>

        <textarea id="text"
            placeholder="ここに文章を入力..."></textarea>

        <div id="status">接続中...</div>

    </div>

</div>

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    set
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";


// Firebase設定
const firebaseConfig = {

    apiKey: "AIzaSyDsVCvRiIuy0ji_jSA1s-hHO63b5eONsYc",

    authDomain: "text-share-a7de6.firebaseapp.com",

    databaseURL: "https://text-share-a7de6-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "text-share-a7de6",

    appId: "1:756434973756:web:35387a44f9cfd842cc7f39"

};


// Firebase初期化
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


// データ保存場所
const textRef = ref(db, "sharedText");


// HTML要素
const loginArea = document.getElementById("loginArea");
const editorArea = document.getElementById("editorArea");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const textarea = document.getElementById("text");

const status = document.getElementById("status");
const loginStatus = document.getElementById("loginStatus");


// 同期管理
let saveTimer = null;
let unsubscribe = null;


// ログイン
document.getElementById("login").addEventListener("click", async () => {

    loginStatus.textContent = "ログイン中...";

    try {

        await signInWithEmailAndPassword(
            auth,
            emailInput.value,
            passwordInput.value
        );

        loginStatus.textContent = "";

    } catch (error) {

        loginStatus.textContent = "ログイン失敗: " + error.message;

    }

});


// ログアウト
document.getElementById("logout").addEventListener("click", async () => {

    await signOut(auth);

});


// ログイン状態監視
onAuthStateChanged(auth, user => {

    if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
    }

    clearTimeout(saveTimer);
    saveTimer = null;

    if (user) {

        loginArea.classList.add("hidden");
        editorArea.classList.remove("hidden");

        status.textContent = "データを読み込み中...";

        // データ変更をリアルタイム監視
        unsubscribe = onValue(textRef, snapshot => {

            // ローカルの入力待ちがあれば上書きしない
            if (saveTimer !== null) return;

            const data = snapshot.val();

            const newText = data ?? "";

            if (textarea.value !== newText) {
                textarea.value = newText;
            }

            status.textContent = "同期中・最新データを表示しています";

        }, error => {

            status.textContent = "読み込みエラー: " + error.message;

        });

    } else {

        loginArea.classList.remove("hidden");
        editorArea.classList.add("hidden");

        textarea.value = "";

    }

});


// 入力されたら自動保存
textarea.addEventListener("input", () => {

    status.textContent = "保存待ち...";

    clearTimeout(saveTimer);

    saveTimer = setTimeout(async () => {

        const content = textarea.value;

        status.textContent = "保存中...";

        try {

            await set(textRef, content);

            status.textContent = "保存完了";

        } catch (error) {

            status.textContent = "保存エラー: " + error.message;

        } finally {

            saveTimer = null;

        }

    }, 400);

});

</script>

</body>
</html>
